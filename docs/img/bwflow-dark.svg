<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="What one bw-connect does: install.sh puts the script on your PATH and bw login runs once per machine; then every unlock checks bw status, runs bw unlock --raw behind a hidden prompt, and writes the token atomically under umask 077 into $XDG_RUNTIME_DIR/bw_session with mode 600, ready for your shells and Claude Code.">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
</defs>
<rect width="1280" height="600" fill="none"/>
<text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#8957e5">ONCE PER MACHINE</text>
<text x="340" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#175DDC">EVERY UNLOCK · bw-connect</text>
<text x="712" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#1FA97F">THE SESSION</text>
<text x="1000" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#20A7C9">WHO USES IT</text>
<rect x="28" y="80" width="250" height="118" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M29 89 a8 8 0 0 1 8-8 h0 v116 h0 a8 8 0 0 1-8-8 Z" fill="#8957e5"/>
<text x="46" y="110" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#e6edf3">install.sh</text>
<text x="46" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">checks bw + python3</text>
<text x="46" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">copies to ~/.local/bin</text>
<text x="46" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">adds it to your PATH</text>
<rect x="28" y="230" width="250" height="86" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M29 239 a8 8 0 0 1 8-8 h0 v84 h0 a8 8 0 0 1-8-8 Z" fill="#8957e5"/>
<text x="46" y="260" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#e6edf3">bw login</text>
<text x="46" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">e-mail + master password</text>
<rect x="28" y="380" width="250" height="118" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M29 389 a8 8 0 0 1 8-8 h0 v116 h0 a8 8 0 0 1-8-8 Z" fill="#cf222e"/>
<text x="46" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">If it fails</text>
<text x="46" y="433" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">logged out → run bw login</text>
<text x="46" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">wrong password → the old</text>
<text x="46" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">session is removed</text>
<rect x="340" y="80" width="310" height="96" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M341 89 a8 8 0 0 1 8-8 h0 v94 h0 a8 8 0 0 1-8-8 Z" fill="#175DDC"/>
<text x="358" y="110" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#e6edf3">1 · bw status</text>
<text x="358" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">is the account logged in?</text>
<rect x="340" y="208" width="310" height="118" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M341 217 a8 8 0 0 1 8-8 h0 v116 h0 a8 8 0 0 1-8-8 Z" fill="#175DDC"/>
<text x="358" y="238" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#e6edf3">2 · bw unlock --raw</text>
<text x="358" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">hidden prompt → stderr</text>
<text x="358" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">token → stdout only</text>
<text x="358" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">password never hits the disk</text>
<rect x="340" y="358" width="310" height="118" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M341 367 a8 8 0 0 1 8-8 h0 v116 h0 a8 8 0 0 1-8-8 Z" fill="#175DDC"/>
<text x="358" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">3 · atomic write</text>
<text x="358" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">umask 077 · mktemp · chmod 600</text>
<text x="358" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">then mv -f into place</text>
<text x="358" y="451" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">never truncated, never absent</text>
<rect x="712" y="150" width="252" height="160" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M713 159 a8 8 0 0 1 8-8 h0 v158 h0 a8 8 0 0 1-8-8 Z" fill="#1FA97F"/>
<text x="730" y="180" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#e6edf3">bw_session</text>
<text x="730" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">$XDG_RUNTIME_DIR/</text>
<text x="730" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">mode 600, in a drwx------ dir</text>
<text x="730" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">wiped on logout</text>
<rect x="712" y="350" width="252" height="110" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M713 359 a8 8 0 0 1 8-8 h0 v108 h0 a8 8 0 0 1-8-8 Z" fill="#1FA97F"/>
<text x="730" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">fallback</text>
<text x="730" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">/tmp/.bw_session-$UID</text>
<text x="730" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">only without XDG_RUNTIME_DIR</text>
<rect x="1000" y="150" width="252" height="160" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M1001 159 a8 8 0 0 1 8-8 h0 v158 h0 a8 8 0 0 1-8-8 Z" fill="#20A7C9"/>
<text x="1018" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">your shells</text>
<text x="1018" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">bw-connect --path prints</text>
<text x="1018" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">the path in use</text>
<text x="1018" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">no copy-paste, ever</text>
<rect x="1000" y="350" width="252" height="110" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<path d="M1001 359 a8 8 0 0 1 8-8 h0 v108 h0 a8 8 0 0 1-8-8 Z" fill="#20A7C9"/>
<text x="1018" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">Claude Code</text>
<text x="1018" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">same session · ! bw-connect</text>
<text x="1018" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">to re-unlock inline</text>
<path d="M154 198 L154 226" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M278 273 C310 273 312 140 336 130" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M494 176 L494 204" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M494 326 L494 354" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M650 417 C680 417 684 250 708 232" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M964 230 L996 230" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M838 310 L838 346" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M1126 310 L1126 346" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M336 150 C304 168 294 372 282 408" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M336 300 C312 328 296 400 282 436" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="28" y="524" width="1224" height="44" rx="7" fill="#0f141a" stroke="#2f363d" stroke-width="1"/>
<text x="640" y="551" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">The master password is typed at a hidden prompt and never touches the disk — only the session token, temporary and revocable, is ever written.</text>
</svg>