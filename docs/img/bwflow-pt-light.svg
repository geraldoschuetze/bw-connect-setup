<path d="M1126 310 L1126 346" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M336 150 C304 168 294 372 282 408" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
