<rect x="28" y="524" width="1224" height="44" rx="7" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="640" y="551" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">A senha master é digitada num prompt oculto e nunca toca o disco — só o token de sessão, temporário e revogável, chega a ser gravado.</text>
</svg>